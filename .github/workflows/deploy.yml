name: Deploy

on:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Kontrollera frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Satt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  backend:
    name: Kontrollera backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Satt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Kontrollera att backend-koden ar giltig
        working-directory: ./backend
        run: node --check server.js

  deploy:
    name: Deploy till EC2
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/docker-banksajt
            git pull
            sudo docker compose down
            sudo NEXT_PUBLIC_API_URL=http://${{ secrets.HOST }}:3001 NEXT_PUBLIC_FEATURE_NEW_DASHBOARD=false docker compose up --build -d
