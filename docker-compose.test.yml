name: docker-banksajt-test

services:
  nextjs:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3011
    ports:
      - "3002:3000"
    depends_on:
      express:
        condition: service_started

  express:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bank_app
      DB_PASSWORD: bank_password
      DB_NAME: bank
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3011:3001"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank_app
      MYSQL_PASSWORD: bank_password
    ports:
      - "3317:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-test-data:
